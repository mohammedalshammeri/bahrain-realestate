<!DOCTYPE html>
<html>
<head>
    <title>Bahrain Property Hub API Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { padding: 10px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>🏠 Bahrain Property Hub API Test</h1>
    
    <div class="test-section">
        <h3>✅ Health Check (Public)</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>🏢 Public Properties (No Auth Required)</h3>
        <button onclick="testPublicProperties()">Get Public Properties</button>
        <div id="properties-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>🌍 Governorates (Public)</h3>
        <button onclick="testGovernorates()">Get Governorates</button>
        <div id="governorates-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>🔐 Company Login</h3>
        <input type="email" id="email" placeholder="Company Email" style="padding: 8px; width: 200px;">
        <input type="password" id="password" placeholder="Password" style="padding: 8px; width: 200px;">
        <button onclick="testLogin()">Login</button>
        <div id="login-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';

        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('health-result').innerHTML = 
                    `<div class="success">✅ Status: ${response.status}<br>Data: ${JSON.stringify(data, null, 2)}</div>`;
            } catch (error) {
                document.getElementById('health-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testPublicProperties() {
            try {
                const response = await fetch(`${API_BASE}/api/public/properties`);
                const data = await response.json();
                document.getElementById('properties-result').innerHTML = 
                    `<div class="success">✅ Status: ${response.status}<br>Properties Count: ${data.data ? data.data.length : 0}</div>`;
            } catch (error) {
                document.getElementById('properties-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testGovernorates() {
            try {
                const response = await fetch(`${API_BASE}/api/public/governorates`);
                const data = await response.json();
                document.getElementById('governorates-result').innerHTML = 
                    `<div class="success">✅ Status: ${response.status}<br>Governorates: ${data.data ? data.data.length : 0}</div>`;
            } catch (error) {
                document.getElementById('governorates-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('login-result').innerHTML = 
                        `<div class="success">✅ Login Successful!<br>Token: ${data.token ? 'Generated' : 'Missing'}</div>`;
                } else {
                    document.getElementById('login-result').innerHTML = 
                        `<div class="error">❌ Login Failed: ${data.message}</div>`;
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
