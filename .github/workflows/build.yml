name: Build Android APK/AAB & iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags
  workflow_dispatch: # Allow manual trigger

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bahrain-realestate-mobile
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './bahrain-realestate-mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build Android App (APK)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build Android App (AAB for Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: bahrain-realestate-mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: bahrain-realestate-mobile/android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./bahrain-realestate-mobile
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './bahrain-realestate-mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Note: For a real App Store build, you need to configure iOS Code Signing.
      # This step builds the App without signing (for Simulator or Jailbroken devices) 
      # or needs secrets configured in GitHub.
      
      - name: Install Cocoapods
        run: |
          cd ios
          pod install

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild -workspace bahrain-property-hub.xcworkspace \
            -scheme bahrain-property-hub \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      # In a production setup, you would use fastlane or xcodebuild archive mapping 
      # with your provisioning profiles stored in GitHub Secrets.
